<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!--Bootstrap CDN version 4.1-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet" href="css/BrandViseProducts.css">
</head>

<body>

    <div id="cloracontainer">

        <div class="cloracontainer-partition-1">
            <span class="clora">Clora</span>
        </div>

        <div class="cloracontainer-partition-2 cloraintrospace">
            <span class="cloraintro">Clora for your comfort</span>
        </div>
    
        <div class="cloracontainer-partition-3" id="iconinstrip">
            <a href="#"><i class="bi bi-person"></i></a>
            <i onclick="showSearchBox()" class="bi bi-search"></i>

            <div id="search-box" class="search-box floating">
            <input  class="search-box-input" type="text">
            <i onclick="Search()" class="bi bi-arrow-right-circle-fill"></i>
            </div>
        </div>
    </div>

    <section class="py-5">

        <div class="category mb-3">
            <div class="brand-topics-area">
                <h2 class="brand-topics">Moose</h2>
            </div>

            <section class="hidden-overflow">
                <div class="tab-content" id="nav-tabContent">
                    <div class="tab-pane fade show active" id="nav-all" role="tabpanel">

                        <div id="product-grid-moose" class="product-grid row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 row-cols-xl-5">

                        </div>
                    </div>
                </div>
            </section>
        </div>

        <div class="category mb-3">
            <div class="brand-topics-area">
                <h2 class="brand-topics">Levis</h2>
            </div>

            <section class="hidden-overflow">
                <div class="tab-content" id="nav-tabContent">
                    <div class="tab-pane fade show active" id="nav-all" role="tabpanel">

                        <div id="product-grid-levis" class="product-grid row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 row-cols-xl-5">

                        </div>
                    </div>
                </div>
            </section>
        </div>

        <div class="category mb-3">
            <div class="brand-topics-area">
                <h2 class="brand-topics">Crocodile</h2>
            </div>
            <section class="hidden-overflow">
                <div class="tab-content" id="nav-tabContent">
                    <div class="tab-pane fade show active" id="nav-all" role="tabpanel">

                        <div id="product-grid-crocodile" class="product-grid row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 row-cols-xl-5">

                        </div>
                    </div>
                </div>
            </section>
        </div>

        <div class="category mb-3">
            <div class="brand-topics-area">
                <h2 class="brand-topics">Signature</h2>
            </div>

            <section class="hidden-overflow">
                <div class="tab-content" id="nav-tabContent">
                    <div class="tab-pane fade show active" id="nav-all" role="tabpanel">

                        <div id="product-grid-signature" class="product-grid row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 row-cols-xl-5">

                        </div>
                    </div>
                </div>
            </section>
        </div>

    </section>

    <script src="js/BrandViseProducts.js"></script>
</body>
</html>
