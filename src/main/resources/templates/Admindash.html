<html lang="en">
<head>
    <meta charset="UTF-8" xmlns:th="http://www.thymeleaf.org">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin</title>

    <!-- External css -->
    <link rel="stylesheet" href="/css/Admindash.css">

    <!--Bootrstap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous"></head>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</head>

<body>
<div class="cloracontainer">
    <h2 class="clora">Clora</h2>
</div>


<section class="py-5">
    <div class="container-fluid addproductson-TrendingItems">
        <h3>Add products on Trending items</h3>

        <div class="container-form">
            <form th:action='@{/admin/addProductOnTrendingItems}' id="trendingItemsInserting" method="post">
                <label for="">Enter product brand ID :</label>
                <input name="brand_item_id" class="inputarea" type="text" placeholder="ex : T1">
                <br>
                <label for="">Item quantity :</label>
                <input name="item_quantity" class="inputarea" type="text" placeholder="ex : 20">
                <br>
                <label for="">Item price :</label>
                <input name="item_price" class="inputarea"type="text" placeholder="ex : 2500">
                <br>
                <label for="">Item sold count :</label>
                <input name="item_sold_count" class="inputarea" type="text" placeholder="ex : 10">

                <br>
                <button type="submit" class="btn btn-secondary">Submit</button>
            </form>

        </div>

    </div>
</section>

<section class="py-5">

    <div class="container-fluid addprodcution-bannerproducts">

        <div class="banner01">

        </div>

        <div class="banner02">

        </div>

        <div class="banner03">

        </div>

    </div>
</section>
</body>
</html>
