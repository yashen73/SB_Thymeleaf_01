<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" http-equiv="content" refresh="3">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>

    <!--External CSS-->
    <link rel="stylesheet" href="/css/AdminLoginCSS.css">

    <!--Bootstrap CDN-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>

<body>
<div class="container-box">
    <div class="row">

        <div class="col-sm-2">

        </div>

        <div class="col-sm-8 login-container">
            <h2 class="clora">Clora</h2>

            <form th:action='@{/admin/login}' method="post">

                <label class="label" for="">Username </label><br>
                <input type="text" class="inputarea" id="username" name="adminusername" placeholder="yashen73">
                <br>
                <label class="label" for="">Password</label><br>
                <input type="password" class="inputarea" id="password" name="adminpassword" placeholder="@1234">

                <div class="buttonarea">
                    <button class="btn btn-primary" type="submit">Log In</button>
                </div>

            </form>
        </div>

        <div class="col-sm-2">

        </div>



    </div>
</div>
</body>
</html>
