<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" http-equiv="refresh" >
    <title>Clora Customer Signup</title>
    <!--Bootstrap CDN version 4.1-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/CustomerSignup.css">
</head>

<body class="body">

<div class="row" id="cloracontainer">

    <div class="cloracontainer-partition-1">
        <span class="clora">Clora</span>
    </div>

    <div class="cloracontainer-partition-2 cloraintrospace">
        <span class="cloraintro"><u>Wear it. Own it.</u></span>
    </div>

    <div class="cloracontainer-partition-3" id="iconinstrip">

        <div>
            <a href="/Profile"><i class="bi bi-person"></i></a>
            <span id="login-indicator" class="indicator"></span>
        </div>

        <div>
            <i onclick="showSearchBox()" class="bi bi-search"></i>
        </div>

        <div id="search-box" class="search-box floating">
            <input  class="search-box-input" type="text">
            <i onclick="Search()" class="bi bi-arrow-right-circle-fill"></i>
        </div>
    </div>
</div>


<div class="row" id="secondrow">
    <div class="col"></div>

    <div class="col-6" id="signupcontainer">

        <div class="card">
            <h3>Sign in</h3>
            <form id="customerSignUpForm">

                <div class="form-floating is-invalid">
                    <input type="name" class="form-control is-invalid" id="name" placeholder="Username" name="name" required>
                    <label for="floatingInputGroup2">Name</label>
                </div>
                <div class="invalid-feedback">
                    Please choose a username.
                </div>

                <div class="form-floating is-invalid">
                    <input type="email" class="form-control is-invalid" id="mail" placeholder="Email" name="mail" required>
                    <label for="floatingInputGroup2">Email</label>
                </div>
                <div class="invalid-feedback">
                    Please choose a email address.
                </div>

                <div class="form-floating is-invalid">
                    <input type="mobile" class="form-control is-invalid" id="tele" placeholder="Username" name="tele" required>
                    <label for="floatingInputGroup2">Mobile No</label>
                </div>
                <div class="invalid-feedback">
                    Please choose a 10-digit mobile no.
                </div>

                <div class="form-floating is-invalid">
                    <input type="password" class="form-control is-invalid" id="floatingInputGroup2" placeholder="Username" name="password" required>
                    <label for="floatingInputGroup2">Password</label>
                </div>
                <div class="invalid-feedback">
                    Include at least 10 characters
                </div>

                <div class="form-floating is-invalid">
                    <input type="passowrd" class="form-control is-invalid" id="password" placeholder="Username" required>
                    <label for="floatingInputGroup2">Confirm Password</label>
                </div>
                <div class="invalid-feedback">
                    Confirm Password.
                </div>


                <div class="row" id="buttonarea">
                    <button type="submit" class="button"> Sign up</button>
                </div>
            </form>
        </div>




    </div>

    <div class="col-4" id="innerrcolumn">
    </div>
</div>




<p th:text="${message}"></p>
<script src="js/CustomerSignup.js"></script>
</body>
</html>
